services:
  backend:
    build:
      context: ./backend
    container_name: backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      - ./data:/data

    environment:
      - DATABASE_PATH=/data/database.db

    restart: unless-stopped

    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app
  
  frontend:
    build:
      context: ./frontend

    container_name: frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      VITE_API_URL: http://localhost:8000

    depends_on:
      - backend
